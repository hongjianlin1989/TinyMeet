name: iOS CI

on:
  push:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PROJECT_PATH: TinyMeet.xcodeproj
  RUBYOPT: -EUTF-8:UTF-8
  SCHEME_NAME: TinyMeet-Staging
  SIMULATOR_NAME: iPhone 16

jobs:
  checkmarx:
    name: Checkmarx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKMARX_BASE_URI: ${{ secrets.CX_BASE_URI }}
      CHECKMARX_TENANT: ${{ secrets.CX_TENANT }}
      CHECKMARX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
      CHECKMARX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Checkmarx configuration
        id: checkmarx-config
        run: |
          missing=0

          for name in CHECKMARX_BASE_URI CHECKMARX_TENANT CHECKMARX_CLIENT_ID CHECKMARX_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret for Checkmarx: $name"
              missing=1
            fi
          done

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Checkmarx is skipped for forked pull requests because repository secrets are not exposed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Checkmarx is skipped until the required repository secrets are configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Run Checkmarx scan
        if: steps.checkmarx-config.outputs.enabled == 'true'
        uses: checkmarx/ast-github-action@1fe318de2993222574e6249750ba9000a4e2a6cd
        with:
          base_uri: ${{ env.CHECKMARX_BASE_URI }}
          cx_tenant: ${{ env.CHECKMARX_TENANT }}
          cx_client_id: ${{ env.CHECKMARX_CLIENT_ID }}
          cx_client_secret: ${{ env.CHECKMARX_CLIENT_SECRET }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          project_name: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
          scan_params: >-
            --report-format sarif
            --output-path .

      - name: Check Checkmarx SARIF output
        if: steps.checkmarx-config.outputs.enabled == 'true' && always()
        id: checkmarx-sarif
        run: |
          if [ -f cx_result.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Checkmarx SARIF report was generated; skipping SARIF upload."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Checkmarx SARIF
        if: steps.checkmarx-config.outputs.enabled == 'true' && steps.checkmarx-sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cx_result.sarif

  swiftlint:
    name: SwiftLint
    runs-on: [self-hosted, macos, x86-64]
    timeout-minutes: 15
    env:
      RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -n "${RUNNER_PASSWORD:-}" ]; then
            echo "$RUNNER_PASSWORD" | sudo -S xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            echo "RUNNER_PASSWORD is not set; using current Xcode selection at $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Install SwiftLint
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew is required to install SwiftLint on the self-hosted runner."
            exit 1
          fi

          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

          swiftlint version

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, macos, x86-64]
    timeout-minutes: 45
    env:
      RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -n "${RUNNER_PASSWORD:-}" ]; then
            echo "$RUNNER_PASSWORD" | sudo -S xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            echo "RUNNER_PASSWORD is not set; using current Xcode selection at $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Set up Bundler dependencies
        run: |
          ruby --version
          gem --version

          if ! command -v bundle >/dev/null 2>&1; then
            gem install bundler
          fi

          bundle --version
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Run unit tests
        run: bundle exec fastlane ios tests
